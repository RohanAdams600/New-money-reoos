<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>LeadQualify AI — Pricing</title>
<style>
  :root {
    --primary: #667eea;
    --secondary: #764ba2;
    --bg: #05050a;
    --panel: #111827;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 3rem 1.5rem;
    background: radial-gradient(circle at 50% 0%, #14142a 0%, var(--bg) 60%);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #e5e7eb;
  }
  .wrap { max-width: 900px; margin: 0 auto; }
  h1 {
    text-align: center;
    font-size: 2rem;
    margin: 0 0 0.5rem;
    background: linear-gradient(135deg, var(--primary), var(--secondary));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .subhead {
    text-align: center;
    color: #9ca3af;
    margin-bottom: 2rem;
    font-size: 0.95rem;
  }
  .tabs {
    display: flex;
    justify-content: center;
    gap: 0.5rem;
    margin-bottom: 2rem;
    flex-wrap: wrap;
  }
  .tab {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.12);
    color: #e5e7eb;
    padding: 0.6rem 1.3rem;
    border-radius: 999px;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .tab:hover { border-color: var(--primary); }
  .tab.active {
    background: linear-gradient(135deg, var(--primary), var(--secondary));
    border-color: transparent;
    color: #fff;
    box-shadow: 0 4px 20px rgba(102, 126, 234, 0.4);
  }
  .spotlight {
    position: relative;
    background: linear-gradient(160deg, rgba(255,255,255,0.06), rgba(255,255,255,0.01));
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 18px;
    padding: 2.5rem 2rem;
    text-align: center;
    backdrop-filter: blur(6px);
  }
  .spotlight.is-target {
    border: 1px solid var(--primary);
    box-shadow: 0 0 40px rgba(118, 75, 162, 0.35);
  }
  .flag {
    display: inline-block;
    background: linear-gradient(135deg, var(--primary), var(--secondary));
    color: #fff;
    font-size: 0.7rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    padding: 0.25rem 0.75rem;
    border-radius: 999px;
    margin-bottom: 1rem;
  }
  .tier-name { font-size: 1.4rem; font-weight: 700; margin-bottom: 0.25rem; }
  .tier-price {
    font-size: 3rem;
    font-weight: 800;
    background: linear-gradient(135deg, var(--primary), var(--secondary));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    line-height: 1.1;
  }
  .tier-price span { font-size: 1rem; color: #9ca3af; -webkit-text-fill-color: #9ca3af; }
  .tier-tagline { color: #9ca3af; margin: 0.75rem 0 1.75rem; font-size: 0.95rem; }
  .features {
    list-style: none;
    padding: 0;
    margin: 0 auto;
    max-width: 420px;
    text-align: left;
    display: grid;
    gap: 0.65rem;
  }
  .features li {
    display: flex;
    align-items: flex-start;
    gap: 0.6rem;
    font-size: 0.92rem;
    color: #d1d5db;
  }
  .features li::before {
    content: "✓";
    color: var(--primary);
    font-weight: 700;
    flex-shrink: 0;
  }
  .cta {
    display: inline-block;
    margin-top: 2rem;
    background: linear-gradient(135deg, var(--primary), var(--secondary));
    color: #fff;
    border: none;
    padding: 0.8rem 2.2rem;
    border-radius: 999px;
    font-size: 0.95rem;
    font-weight: 700;
    cursor: pointer;
    text-decoration: none;
  }
  .cta:disabled { opacity: 0.6; cursor: not-allowed; }
  .signup-form {
    max-width: 380px;
    margin: 1.75rem auto 0;
    text-align: left;
  }
  .signup-form label {
    display: block;
    font-size: 0.8rem;
    font-weight: 600;
    color: #9ca3af;
    margin: 0.75rem 0 0.3rem;
  }
  .signup-form input,
  .signup-form textarea {
    width: 100%;
    padding: 0.55rem 0.7rem;
    border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.15);
    background: rgba(255,255,255,0.05);
    color: #e5e7eb;
    font-size: 0.9rem;
    font-family: inherit;
  }
  .signup-form textarea { resize: vertical; }
  .signup-status { margin-top: 0.6rem; font-size: 0.85rem; min-height: 1.2em; }
  .signup-status.error { color: #ef4444; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Pricing</h1>
  <p class="subhead">AI-powered lead qualification for digital marketing agencies</p>

  <div class="tabs" id="tabs"></div>
  <div class="spotlight" id="spotlight"></div>
</div>

<script>
  // Point this at your deployed LeadQualify AI server when embedding this widget
  // on a different domain. Leave as '' if the widget is served from the same
  // origin as the API (e.g. copied into the app's own /public folder).
  const API_BASE = '';

  // Real product tiers — cheap entry point, the $4,500/mo plan we're actually
  // selling as the target, and an enterprise tier at 10x the target price.
  const TIERS = [
    {
      id: 'starter',
      name: 'Starter',
      price: 1500,
      tagline: 'For agencies just getting started with automated lead qualification',
      features: [
        'Up to 200 classified leads/month',
        'HOT / WARM / COLD classification',
        'Real-time dashboard & stats',
        '1 webhook, standard qualifying questions template',
        'Email support (48-hour response)',
      ],
    },
    {
      id: 'growth',
      name: 'Growth',
      price: 4500,
      target: true,
      tagline: 'Our target plan — built for growing agencies with high lead flow',
      features: [
        'Unlimited classified leads',
        'Full dashboard: live metrics, lead log, CSV export',
        'Fully customizable ICP & qualifying questions',
        'Edit/manage customer profiles, in-browser lead testing',
        'Priority email + chat support (same-day response)',
      ],
    },
    {
      id: 'enterprise',
      name: 'Enterprise',
      price: 45000,
      tagline: 'For agency networks, franchises, and holding companies running multiple brands at scale',
      features: [
        'Everything in Growth, across unlimited sub-brands/webhooks',
        'Dedicated account manager & onboarding',
        'Custom-tuned classification criteria per brand',
        'White-label dashboard (your branding, not ours)',
        'API access for direct CRM/telephony integration',
        'SLA-backed uptime & dedicated infrastructure',
      ],
    },
  ];

  let activeId = 'growth'; // default to the plan we're actually selling
  let signupOpenFor = null; // which tier's signup form is expanded, if any

  function formatPrice(n) {
    return '$' + n.toLocaleString('en-US');
  }

  function escapeHtml(str) {
    return String(str ?? '').replace(/[&<>"']/g, (c) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
    }[c]));
  }

  function render() {
    const tabsEl = document.getElementById('tabs');
    const spotlightEl = document.getElementById('spotlight');
    const active = TIERS.find((t) => t.id === activeId);
    const formOpen = signupOpenFor === active.id;

    tabsEl.innerHTML = TIERS.map((t) => `
      <button type="button" class="tab ${t.id === activeId ? 'active' : ''}" data-id="${t.id}">
        ${t.name} — ${formatPrice(t.price)}/mo
      </button>
    `).join('');

    spotlightEl.className = `spotlight ${active.target ? 'is-target' : ''}`;
    spotlightEl.innerHTML = `
      ${active.target ? '<div class="flag">Target Plan</div>' : ''}
      <div class="tier-name">${active.name}</div>
      <div class="tier-price">${formatPrice(active.price)}<span>/month</span></div>
      <div class="tier-tagline">${active.tagline}</div>
      <ul class="features">
        ${active.features.map((f) => `<li>${f}</li>`).join('')}
      </ul>
      <button type="button" class="cta" id="get-started-btn">${formOpen ? 'Cancel' : 'Get Started'}</button>
      ${formOpen ? `
        <form class="signup-form" id="signup-form">
          <label>Company Name</label>
          <input type="text" name="name" required placeholder="e.g. Acme Growth Agency" />
          <label>What you do</label>
          <textarea name="description" rows="2" required placeholder="e.g. Full-service digital marketing agency"></textarea>
          <button type="submit" class="cta">Continue to Checkout — ${formatPrice(active.price)}/mo</button>
          <div class="signup-status" id="signup-status"></div>
        </form>
      ` : ''}
    `;

    tabsEl.querySelectorAll('.tab').forEach((btn) => {
      btn.addEventListener('click', () => {
        activeId = btn.dataset.id;
        signupOpenFor = null;
        render();
      });
    });

    document.getElementById('get-started-btn').addEventListener('click', () => {
      signupOpenFor = formOpen ? null : active.id;
      render();
    });

    const form = document.getElementById('signup-form');
    if (form) {
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const statusEl = document.getElementById('signup-status');
        const submitBtn = form.querySelector('button[type="submit"]');
        submitBtn.disabled = true;
        statusEl.textContent = 'Starting checkout...';
        statusEl.className = 'signup-status';

        try {
          const res = await fetch(`${API_BASE}/api/checkout`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              planId: active.id,
              name: form.name.value.trim(),
              description: form.description.value.trim(),
            }),
          });
          const data = await res.json().catch(() => ({}));
          if (!res.ok) throw new Error(data.error || `Checkout failed (${res.status})`);
          window.location.href = data.url;
        } catch (err) {
          statusEl.textContent = escapeHtml(err.message) + (API_BASE === '' ? ' — set API_BASE at the top of this file if the API is on a different domain.' : '');
          statusEl.className = 'signup-status error';
          submitBtn.disabled = false;
        }
      });
    }
  }

  render();
</script>
</body>
</html>
